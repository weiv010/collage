<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A4 사진 콜라주</title>
<style>
  :root{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --line:#e3e5ea;
    --text:#1c1e22;
    --muted:#6b7280;
    --accent:#2f6df6;
    --accent-soft:#e8f0ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    min-height:100vh;
  }

  /* ---------- 사이드 패널 ---------- */
  .sidebar{
    width:300px;
    flex:0 0 300px;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:22px 20px;
    display:flex;
    flex-direction:column;
    gap:22px;
    overflow-y:auto;
    height:100vh;
    position:sticky;
    top:0;
  }
  .brand{font-size:19px;font-weight:700;letter-spacing:-.02em;}
  .brand small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:4px;}

  .group-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}

  .tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tpl{
    border:1.5px solid var(--line);
    border-radius:10px;
    background:#fff;
    padding:10px 8px;
    cursor:pointer;
    text-align:center;
    transition:.15s;
  }
  .tpl:hover{border-color:#b9c4da;}
  .tpl.active{border-color:var(--accent);background:var(--accent-soft);}
  .tpl .preview{
    margin:0 auto 8px;
    background:#fff;
    border:1px solid #cdd3de;
    display:grid;
    gap:2px;
    padding:3px;
  }
  .tpl .preview span{background:#c7cfdd;border-radius:2px;}
  .tpl.active .preview span{background:var(--accent);}
  .tpl-label{font-size:12px;font-weight:600;}
  .tpl-sub{font-size:10.5px;color:var(--muted);margin-top:2px;}

  .btn{
    width:100%;
    border:none;
    border-radius:9px;
    padding:11px 14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.15s;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#255cd6;}
  .btn-ghost{background:#eef0f4;color:var(--text);}
  .btn-ghost:hover{background:#e2e5ec;}
  .btn-row{display:flex;gap:8px;}
  .btn-row .btn{padding:10px;font-size:13px;}

  .hint{font-size:12px;line-height:1.6;color:var(--muted);}
  .hint b{color:var(--text);}

  .spacer{flex:1;}

  /* ---------- 편집 컨트롤 ---------- */
  .controls{
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    background:#fafbfc;
    display:none;
  }
  .controls.show{display:block;}
  .controls h4{margin:0 0 12px;font-size:13px;}
  .ctrl-row{margin-bottom:12px;}
  .ctrl-row label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .ctrl-row input[type=range]{width:100%;accent-color:var(--accent);}
  .mini-row{display:flex;gap:6px;margin-top:4px;}
  .mini-btn{
    flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;
    padding:7px;font-size:12px;cursor:pointer;font-weight:600;
  }
  .mini-btn:hover{background:#f0f2f6;}
  .mini-btn.danger{color:#d63b3b;border-color:#f0c4c4;}

  /* ---------- 작업 영역 ---------- */
  .stage{
    flex:1;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px;
    overflow:auto;
    height:100vh;
  }
  .sheet-wrap{
    display:inline-block;
    box-shadow:0 10px 40px rgba(20,30,60,.18);
  }
  .sheet{
    background:#fff;
    display:grid;
    gap:0;
    overflow:hidden;
  }
  /* 화면상 A4 크기(mm) */
  .sheet.portrait{width:210mm;height:297mm;}
  .sheet.landscape{width:297mm;height:210mm;}

  .cell{
    position:relative;
    overflow:hidden;
    background:#eef0f3;
    cursor:pointer;
  }
  .cell.selected{outline:2px solid var(--accent);outline-offset:-2px;z-index:2;}
  .cell .frame{
    position:absolute;
    top:50%;left:50%;
    width:100%;height:100%;
    transform-origin:center center;
    will-change:transform;
  }
  .cell img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    -webkit-user-drag:none;
    user-select:none;
    pointer-events:none;
  }
  .cell.has-img{cursor:grab;background:#fff;}
  .cell.has-img.dragging{cursor:grabbing;}
  .placeholder{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:8px;color:#9aa2b1;pointer-events:none;
  }
  .placeholder svg{width:34px;height:34px;opacity:.7;}
  .placeholder span{font-size:13px;font-weight:600;}
  .cell.has-img .placeholder{display:none;}

  /* ---------- 인쇄 ---------- */
  @media print{
    .sidebar{display:none !important;}
    body{background:#fff;display:block;}
    .stage{padding:0;overflow:visible;height:auto;display:block;}
    .sheet-wrap{box-shadow:none;display:block;}
    .cell{outline:none !important;background:#fff;}
    .cell .placeholder{display:none !important;}
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">A4 사진 콜라주<small>사진을 넣고 확대·회전해 인쇄하세요</small></div>

    <div>
      <div class="group-title">레이아웃</div>
      <div class="tpl-grid" id="tplGrid"></div>
    </div>

    <div id="controls" class="controls">
      <h4>선택한 칸 편집</h4>
      <div class="ctrl-row">
        <label>확대/축소 <span id="zoomVal">100%</span></label>
        <input type="range" id="zoom" min="1" max="5" step="0.01" value="1">
      </div>
      <div class="ctrl-row">
        <label>회전 <span id="rotVal">0°</span></label>
        <input type="range" id="rot" min="-180" max="180" step="1" value="0">
        <div class="mini-row">
          <button class="mini-btn" data-rot="-90">⟲ 90°</button>
          <button class="mini-btn" data-rot="90">⟳ 90°</button>
        </div>
      </div>
      <div class="mini-row">
        <button class="mini-btn" id="changeImg">사진 교체</button>
        <button class="mini-btn" id="resetImg">맞춤</button>
        <button class="mini-btn danger" id="removeImg">삭제</button>
      </div>
    </div>

    <div>
      <div class="group-title">사진</div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="addAll">빈 칸 채우기</button>
      </div>
    </div>

    <p class="hint">
      <b>사용법</b><br>
      · 칸을 클릭해 사진을 넣습니다.<br>
      · 사진을 <b>드래그</b>하면 이동합니다.<br>
      · <b>마우스 휠</b>로 확대/축소합니다.<br>
      · 슬라이더로 확대·회전을 조절합니다.
    </p>

    <div class="spacer"></div>

    <button class="btn btn-primary" id="printBtn">인쇄 / PDF 저장</button>
  </aside>

  <main class="stage">
    <div class="sheet-wrap">
      <div class="sheet portrait" id="sheet"></div>
    </div>
  </main>

  <input type="file" id="fileInput" accept="image/*" style="display:none">
  <input type="file" id="fileInputMulti" accept="image/*" multiple style="display:none">

<script>
(function(){
  "use strict";

  const TEMPLATES = {
    portrait2:  {orient:"portrait",  rows:2, cols:1, label:"세로 2칸", sub:"위아래 2등분"},
    portrait4:  {orient:"portrait",  rows:4, cols:1, label:"세로 4칸", sub:"위아래 4등분"},
    landscape3: {orient:"landscape", rows:1, cols:3, label:"가로 3칸", sub:"옆으로 3등분"},
  };

  const sheet   = document.getElementById("sheet");
  const tplGrid = document.getElementById("tplGrid");
  const fileInput      = document.getElementById("fileInput");
  const fileInputMulti = document.getElementById("fileInputMulti");
  const controls = document.getElementById("controls");
  const zoom = document.getElementById("zoom");
  const rot  = document.getElementById("rot");
  const zoomVal = document.getElementById("zoomVal");
  const rotVal  = document.getElementById("rotVal");

  let currentTpl = "portrait2";
  let cells = [];        // { el, frame, img, state } 배열
  let selected = -1;     // 선택된 칸 index

  // ---------- 레이아웃 미리보기 썸네일 ----------
  function buildTemplateButtons(){
    Object.keys(TEMPLATES).forEach(key=>{
      const t = TEMPLATES[key];
      const el = document.createElement("div");
      el.className = "tpl" + (key===currentTpl?" active":"");
      el.dataset.key = key;

      const isPortrait = t.orient==="portrait";
      const pw = isPortrait ? 34 : 48;
      const ph = isPortrait ? 48 : 34;
      const preview = document.createElement("div");
      preview.className = "preview";
      preview.style.width = pw+"px";
      preview.style.height = ph+"px";
      preview.style.gridTemplateColumns = "repeat("+t.cols+",1fr)";
      preview.style.gridTemplateRows = "repeat("+t.rows+",1fr)";
      for(let i=0;i<t.rows*t.cols;i++) preview.appendChild(document.createElement("span"));

      const lbl = document.createElement("div");
      lbl.className="tpl-label"; lbl.textContent=t.label;
      const sub = document.createElement("div");
      sub.className="tpl-sub"; sub.textContent=t.sub;

      el.append(preview,lbl,sub);
      el.addEventListener("click",()=>setTemplate(key));
      tplGrid.appendChild(el);
    });
  }

  function setTemplate(key){
    currentTpl = key;
    document.querySelectorAll(".tpl").forEach(e=>e.classList.toggle("active",e.dataset.key===key));
    buildSheet();
  }

  // ---------- 시트(칸) 생성 ----------
  function buildSheet(){
    const t = TEMPLATES[currentTpl];
    sheet.className = "sheet " + t.orient;
    sheet.style.gridTemplateColumns = "repeat("+t.cols+",1fr)";
    sheet.style.gridTemplateRows = "repeat("+t.rows+",1fr)";
    sheet.innerHTML = "";
    cells = [];
    selected = -1;
    hideControls();

    const count = t.rows*t.cols;
    for(let i=0;i<count;i++){
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.index = i;

      const frame = document.createElement("div");
      frame.className = "frame";
      const img = document.createElement("img");
      frame.appendChild(img);

      const ph = document.createElement("div");
      ph.className = "placeholder";
      ph.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 5"/><circle cx="8" cy="9" r="1.4"/></svg><span>사진 추가</span>';

      cell.append(frame, ph);
      sheet.appendChild(cell);

      const record = {
        el:cell, frame, img,
        state:{ x:0, y:0, scale:1, rot:0, src:null }
      };
      cells.push(record);
      attachCellEvents(record, i);
    }
  }

  // ---------- 변환 적용 ----------
  function applyTransform(rec){
    const s = rec.state;
    rec.frame.style.transform =
      `translate(calc(-50% + ${s.x}px), calc(-50% + ${s.y}px)) rotate(${s.rot}deg) scale(${s.scale})`;
  }

  // ---------- 칸 이벤트(드래그/휠/선택) ----------
  function attachCellEvents(rec, index){
    const cell = rec.el;

    cell.addEventListener("click",(e)=>{
      // 드래그 후 클릭 방지
      if(cell._moved) { cell._moved=false; return; }
      selectCell(index);
      if(!rec.state.src){
        openFilePicker(index);
      }
    });

    // 드래그로 이동
    let dragging=false, sx=0, sy=0, ox=0, oy=0;
    cell.addEventListener("pointerdown",(e)=>{
      if(!rec.state.src) return;
      dragging=true; cell._moved=false;
      sx=e.clientX; sy=e.clientY;
      ox=rec.state.x; oy=rec.state.y;
      cell.classList.add("dragging");
      cell.setPointerCapture(e.pointerId);
    });
    cell.addEventListener("pointermove",(e)=>{
      if(!dragging) return;
      const dx=e.clientX-sx, dy=e.clientY-sy;
      if(Math.abs(dx)>3||Math.abs(dy)>3) cell._moved=true;
      rec.state.x = ox+dx;
      rec.state.y = oy+dy;
      applyTransform(rec);
    });
    const endDrag=(e)=>{
      if(!dragging) return;
      dragging=false;
      cell.classList.remove("dragging");
    };
    cell.addEventListener("pointerup",endDrag);
    cell.addEventListener("pointercancel",endDrag);

    // 휠로 확대/축소
    cell.addEventListener("wheel",(e)=>{
      if(!rec.state.src) return;
      e.preventDefault();
      selectCell(index);
      const delta = e.deltaY<0 ? 1.08 : 1/1.08;
      rec.state.scale = clamp(rec.state.scale*delta, 1, 8);
      applyTransform(rec);
      syncControls();
    },{passive:false});
  }

  function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

  // ---------- 선택 ----------
  function selectCell(index){
    selected = index;
    cells.forEach((c,i)=>c.el.classList.toggle("selected", i===index));
    if(cells[index].state.src){ showControls(); syncControls(); }
    else hideControls();
  }
  function showControls(){controls.classList.add("show");}
  function hideControls(){controls.classList.remove("show");}

  function syncControls(){
    if(selected<0) return;
    const s = cells[selected].state;
    zoom.value = s.scale;
    rot.value  = s.rot;
    zoomVal.textContent = Math.round(s.scale*100)+"%";
    rotVal.textContent  = Math.round(s.rot)+"°";
  }

  // ---------- 파일 선택 ----------
  let pickTarget = -1;
  function openFilePicker(index){
    pickTarget = index;
    fileInput.value = "";
    fileInput.click();
  }
  fileInput.addEventListener("change",()=>{
    const f = fileInput.files[0];
    if(!f || pickTarget<0) return;
    loadImageToCell(pickTarget, f);
  });

  function loadImageToCell(index, file){
    const rec = cells[index];
    const url = URL.createObjectURL(file);
    rec.img.onload = ()=>{
      rec.el.classList.add("has-img");
      rec.state = { x:0, y:0, scale:1, rot:0, src:url };
      applyTransform(rec);
      selectCell(index);
      URL.revokeObjectURL(url); // img가 이미 디코드됨
    };
    rec.img.src = url;
  }

  // ---------- 빈 칸 일괄 채우기 ----------
  document.getElementById("addAll").addEventListener("click",()=>{
    fileInputMulti.value="";
    fileInputMulti.click();
  });
  fileInputMulti.addEventListener("change",()=>{
    const files = Array.from(fileInputMulti.files);
    let fi = 0;
    for(let i=0;i<cells.length && fi<files.length;i++){
      if(!cells[i].state.src){
        loadImageToCell(i, files[fi]);
        fi++;
      }
    }
  });

  // ---------- 컨트롤 바인딩 ----------
  zoom.addEventListener("input",()=>{
    if(selected<0) return;
    cells[selected].state.scale = parseFloat(zoom.value);
    applyTransform(cells[selected]);
    zoomVal.textContent = Math.round(zoom.value*100)+"%";
  });
  rot.addEventListener("input",()=>{
    if(selected<0) return;
    cells[selected].state.rot = parseFloat(rot.value);
    applyTransform(cells[selected]);
    rotVal.textContent = Math.round(rot.value)+"°";
  });
  document.querySelectorAll("[data-rot]").forEach(b=>{
    b.addEventListener("click",()=>{
      if(selected<0) return;
      let r = cells[selected].state.rot + parseInt(b.dataset.rot,10);
      while(r>180) r-=360; while(r<-180) r+=360;
      cells[selected].state.rot = r;
      applyTransform(cells[selected]);
      syncControls();
    });
  });
  document.getElementById("changeImg").addEventListener("click",()=>{
    if(selected<0) return; openFilePicker(selected);
  });
  document.getElementById("resetImg").addEventListener("click",()=>{
    if(selected<0) return;
    const rec = cells[selected];
    rec.state.x=0; rec.state.y=0; rec.state.scale=1; rec.state.rot=0;
    applyTransform(rec); syncControls();
  });
  document.getElementById("removeImg").addEventListener("click",()=>{
    if(selected<0) return;
    const rec = cells[selected];
    rec.img.removeAttribute("src");
    rec.el.classList.remove("has-img");
    rec.state = { x:0, y:0, scale:1, rot:0, src:null };
    rec.frame.style.transform="";
    hideControls();
    cells.forEach(c=>c.el.classList.remove("selected"));
    selected=-1;
  });

  // ---------- 인쇄 ----------
  const printStyle = document.createElement("style");
  document.head.appendChild(printStyle);
  document.getElementById("printBtn").addEventListener("click",()=>{
    const orient = TEMPLATES[currentTpl].orient;
    printStyle.textContent = `@page{ size:A4 ${orient}; margin:0; }`;
    window.print();
  });

  // 배경(빈 곳) 클릭 시 선택 해제
  document.querySelector(".stage").addEventListener("pointerdown",(e)=>{
    if(e.target.classList.contains("stage") || e.target.classList.contains("sheet-wrap")){
      cells.forEach(c=>c.el.classList.remove("selected"));
      selected=-1; hideControls();
    }
  });

  // ---------- 초기화 ----------
  buildTemplateButtons();
  buildSheet();
})();
</script>
</body>
</html>
